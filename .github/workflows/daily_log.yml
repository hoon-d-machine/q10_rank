name: Daily CSV Logging

on:
  repository_dispatch:
    types: [daily_trigger]

jobs:
  logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl
        
      - name: Run CSV Logger
        env:
          DY_SUPABASE_URL: ${{ secrets.DY_SUPABASE_URL }}
          DY_SUPABASE_KEY: ${{ secrets.DY_SUPABASE_KEY }}
        run: python csv_logger.py
        
      - name: Commit and Push
        if: always()   # 수집 단계가 실패해도 성공한 데이터는 남긴다 (잡은 실패로 표시됨)
        run: |
          git config --global user.name "hoon-d-machine"
          git config --global user.email "hoon-d-machine@users.noreply.github.com"
          git add data/*.csv
          git commit -m "Update CSV logs: $(date +'%Y-%m-%d')" || echo "No changes"
          git push

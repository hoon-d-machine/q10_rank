<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전통 혼례 식순</title>
<meta name="description" content="전통 사대부가 혼인례(친영례) 식순과 각 의식의 뜻을 쉽게 풀어 소개해요.">
<meta property="og:title" content="전통 혼례 식순">
<meta property="og:description" content="두루마리를 펼쳐 보세요. 오늘 혼례의 순서와 의식마다 담긴 뜻을 알려드려요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#7db6d4">
<meta name="theme-color" content="#1a2f52" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="darkreader-lock">
<meta name="robots" content="noindex">
<script>document.documentElement.className = "js";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;800&family=Hahmlet:wght@700;900&family=Noto+Serif+JP:wght@600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;800&family=Hahmlet:wght@700;900&family=Noto+Serif+JP:wght@600;800&display=swap"></noscript>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"></noscript>
<link rel="stylesheet" href="/assets/honrye.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="flower" viewBox="0 0 100 100">
    <g stroke="#7b1e2b" stroke-width="1.6" stroke-linejoin="round">
      <g fill="#ee7a1f"><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(0 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(30 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(60 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(90 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(120 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(150 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(180 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(210 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(240 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(270 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(300 50 50)"/><ellipse cx="50" cy="21" rx="9.5" ry="20" transform="rotate(330 50 50)"/></g>
      <g fill="#9a2430"><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(15 50 50)"/><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(60 50 50)"/><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(105 50 50)"/><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(150 50 50)"/><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(195 50 50)"/><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(240 50 50)"/><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(285 50 50)"/><ellipse cx="50" cy="31" rx="7.5" ry="15" transform="rotate(330 50 50)"/></g>
      <g fill="#2a5fa8"><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(0 50 50)"/><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(45 50 50)"/><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(90 50 50)"/><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(135 50 50)"/><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(180 50 50)"/><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(225 50 50)"/><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(270 50 50)"/><ellipse cx="50" cy="38" rx="6" ry="10.5" transform="rotate(315 50 50)"/></g>
    </g>
    <g fill="#f8f1de"><circle cx="50" cy="34" r="1.8" transform="rotate(0 50 50)"/><circle cx="50" cy="34" r="1.8" transform="rotate(45 50 50)"/><circle cx="50" cy="34" r="1.8" transform="rotate(90 50 50)"/><circle cx="50" cy="34" r="1.8" transform="rotate(135 50 50)"/><circle cx="50" cy="34" r="1.8" transform="rotate(180 50 50)"/><circle cx="50" cy="34" r="1.8" transform="rotate(225 50 50)"/><circle cx="50" cy="34" r="1.8" transform="rotate(270 50 50)"/><circle cx="50" cy="34" r="1.8" transform="rotate(315 50 50)"/></g>
    <circle cx="50" cy="50" r="9" fill="#f8f1de" stroke="#7b1e2b" stroke-width="1.6"/><circle cx="50" cy="50" r="4.2" fill="#c1272d"/>
  </symbol>
  <symbol id="cloud-a" viewBox="0 0 130 34"><g fill="#fbfaf3"><rect x="0" y="0" width="60" height="11" rx="5.5"/><rect x="46" y="11" width="3" height="12" rx="1.5"/><rect x="30" y="23" width="100" height="11" rx="5.5"/></g></symbol>
  <symbol id="cloud-b" viewBox="0 0 130 34"><g fill="#fbfaf3"><rect x="70" y="0" width="60" height="11" rx="5.5"/><rect x="81" y="11" width="3" height="12" rx="1.5"/><rect x="0" y="23" width="100" height="11" rx="5.5"/></g></symbol>
  <symbol id="cloud-c" viewBox="0 0 130 49"><g fill="#fbfaf3"><rect x="14" y="0" width="48" height="11" rx="5.5"/><rect x="50" y="11" width="3" height="8" rx="1.5"/><rect x="40" y="19" width="90" height="11" rx="5.5"/><rect x="46" y="30" width="3" height="8" rx="1.5"/><rect x="0" y="38" width="56" height="11" rx="5.5"/></g></symbol>
</svg>
<header class="poster">
  <div class="frame" aria-hidden="true"></div>
  <svg class="fl fl-top" aria-hidden="true"><use href="#flower"/></svg>
  <svg class="fl fl-l" aria-hidden="true"><use href="#flower"/></svg>
  <svg class="fl fl-r" aria-hidden="true"><use href="#flower"/></svg>
  <svg class="cloud c1" viewBox="0 0 130 34" aria-hidden="true"><use href="#cloud-a"/></svg>
  <svg class="cloud c2" viewBox="0 0 130 34" aria-hidden="true"><use href="#cloud-b"/></svg>
  <svg class="cloud c3" viewBox="0 0 130 49" aria-hidden="true"><use href="#cloud-c"/></svg>
  <svg class="cloud c4" viewBox="0 0 130 34" aria-hidden="true"><use href="#cloud-b"/></svg>
  <svg class="arch" viewBox="0 0 120 64" aria-hidden="true"><g fill="none" stroke="#fbfaf3" stroke-width="5" stroke-linecap="round"><path d="M12 60a48 48 0 0 1 96 0"/><path d="M30 60a30 30 0 0 1 60 0"/></g><path d="M48 60a12 12 0 0 1 24 0z" fill="#fbfaf3"/></svg>
  <p class="eyebrow" id="eyebrow">Traditional Korean Wedding</p>
  <h1 id="title">전통 혼례<br>식순</h1>
  <p class="sub" id="sub">전통 사대부가 혼인례 · 친영례</p>
  <p class="couple" id="couple" hidden></p>
  <div class="lang" role="group" aria-label="Language / 언어 / 言語">
    <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
    <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
  </div>
</header>


<main class="scroll" id="scroll">
  <div class="rod rod-top" aria-hidden="true">
    <svg class="cord" viewBox="0 0 100 50" preserveAspectRatio="none"><path d="M0 50 L50 3 L100 50"/></svg>
    <i class="hook"></i>
  </div>

  <div class="sheet" id="sheet">
    <article class="paper" id="paper">
      <div class="strip" aria-hidden="true"></div>
      <div class="panel">

      <header class="head">
        <div class="knot" aria-hidden="true"><i></i><b></b><i></i></div>
        <p class="lead" id="intro"></p>
        <p class="lead" id="count"></p>
        <p class="hint"><span class="hand" aria-hidden="true">☞</span> <span id="hint"></span></p>
        <button class="all" type="button" id="toggleAll" aria-pressed="false"></button>
        <noscript><p class="lead">JavaScript가 꺼져 있으면 식순을 볼 수 없어요. 켜 주세요.</p></noscript>
      </header>

      <ol class="steps" id="steps"></ol>

      <footer class="foot">
        <div class="knot" aria-hidden="true"><i></i><b></b><i></i></div>
        <p id="thanks"></p>
      </footer>
      </div>
      <div class="strip" aria-hidden="true"></div>
    </article>
  </div>

  <div class="rod rod-bottom" aria-hidden="true">
    <svg class="tassel" viewBox="0 0 36 100">
      <path d="M18 0 V26" stroke="#7b1e2b" stroke-width="2.2" fill="none"/>
      <g fill="none" stroke="#7b1e2b" stroke-width="2.4">
        <ellipse cx="18" cy="34" rx="11" ry="5" transform="rotate(0 18 34)"/><ellipse cx="18" cy="34" rx="11" ry="5" transform="rotate(45 18 34)"/>
        <ellipse cx="18" cy="34" rx="11" ry="5" transform="rotate(90 18 34)"/><ellipse cx="18" cy="34" rx="11" ry="5" transform="rotate(135 18 34)"/>
      </g>
      <circle cx="18" cy="34" r="4" fill="#e8661c" stroke="#7b1e2b" stroke-width="1.6"/>
      <rect x="14.5" y="46" width="7" height="8" fill="#7b1e2b"/>
      <rect x="11" y="54" width="14" height="11" rx="3" fill="#e8661c" stroke="#7b1e2b" stroke-width="1.6"/>
      <g stroke-linecap="round" stroke-width="2.2" fill="none">
        <path d="M12 66 Q10 82 9 98" stroke="#7b1e2b"/><path d="M15 66 Q14 82 13.5 99" stroke="#e8661c"/><path d="M18 66 V100" stroke="#7b1e2b"/>
        <path d="M21 66 Q22 82 22.5 99" stroke="#e8661c"/><path d="M24 66 Q26 82 27 98" stroke="#7b1e2b"/>
      </g>
    </svg>
  </div>
</main>


<div class="end" aria-hidden="true">
  <svg class="cloud e1" viewBox="0 0 130 34"><use href="#cloud-a"/></svg>
  <svg class="cloud e2" viewBox="0 0 130 49"><use href="#cloud-c"/></svg>
  <svg class="fl fl-bl"><use href="#flower"/></svg>
  <svg class="fl fl-br"><use href="#flower"/></svg>
</div>

<script src="/config.js"></script>
<script src="/content-default.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/honrye.js"></script>
</body>
</html>

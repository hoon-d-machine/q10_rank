<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DY-AI</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="/assets/dy.css">
<link rel="stylesheet" href="/assets/main.css">
</head>
<body>

<!-- 탑바: 비워두고 Q10 수집 버튼 하나만 (장식용, 아직 동작 없음) -->
<header class="topbar">
  <button class="q10-btn" type="button" aria-label="Q10 수집">
    <svg class="q10-art" viewBox="0 0 64 64" aria-hidden="true">
      <!-- 쇼핑백 캐릭터 -->
      <path d="M12 24 H52 L48 56 H16 Z" fill="#f0646a" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M22 24 V18 a10 10 0 0 1 20 0 V24" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="38" r="2.6" fill="#111"/><circle cx="38" cy="38" r="2.6" fill="#111"/>
      <path d="M26 45 Q32 51 38 45" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <!-- 내려받기 화살표 배지 -->
      <circle cx="52" cy="14" r="10" fill="#ffd21f" stroke="#111" stroke-width="3"/>
      <path d="M52 9 V19 M47.5 14.5 L52 19 L56.5 14.5" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="label">Q10 수집</span>
    <svg class="spark s1" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <svg class="spark s2" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" fill="#1b8fe0" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </button>
</header>

<main class="scene grid-mist hero">
  <div class="deco" style="--x:5%;--y:20%;--s:110px" data-depth="22"><div class="bob" style="--d:7s"><svg class="daisy" viewBox="0 0 100 100"><use href="#daisy"/></svg></div></div>
  <div class="deco" style="--x:86%;--y:12%;--s:90px" data-depth="38"><div class="bob" style="--d:6s;--delay:-2s"><svg class="daisy" style="--sp:18s" viewBox="0 0 100 100"><use href="#daisy"/></svg></div></div>
  <div class="deco" style="--x:15%;--y:62%;--s:72px" data-depth="44"><div class="bob" style="--d:9s"><div class="cube" style="--s:72px"><i>D</i><i>Y</i><i>A</i><i>I</i><i>✿</i><i>★</i></div></div></div>
  <div class="deco" style="--x:78%;--y:58%;--s:58px" data-depth="50"><div class="bob" style="--d:7.5s;--delay:-3s"><div class="cube" style="--s:58px;--cs:11s"><i>A</i><i>I</i><i>D</i><i>Y</i><i>★</i><i>✿</i></div></div></div>

  <div class="stage" data-tilt="12">
    <div data-logo="3d"></div>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/assets/dy.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DY-AI</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="/assets/dy.css">
<link rel="stylesheet" href="/assets/login.css">
</head>
<body>
<main class="scene bg-orange login-scene">

  <!-- 아래쪽 무지개 -->
  <div class="rainbow" data-depth="8"><svg viewBox="-40 -140 1080 600" aria-hidden="true"><use href="#rainbow"/></svg></div>

  <!-- 배경 3D 오브제 (포인터에 따라 깊이별로 움직임) -->
  <div class="deco" style="--x:6%;--y:12%;--s:120px" data-depth="26"><div class="bob" style="--d:7s"><svg class="daisy" viewBox="0 0 100 100"><use href="#daisy"/></svg></div></div>
  <div class="deco" style="--x:84%;--y:8%;--s:84px" data-depth="40"><div class="bob" style="--d:6s;--delay:-2s"><svg class="daisy" style="--sp:18s" viewBox="0 0 100 100"><use href="#daisy"/></svg></div></div>
  <div class="deco" style="--x:80%;--y:56%;--s:130px" data-depth="18"><div class="bob" style="--d:8s;--delay:-4s"><svg class="daisy" style="--sp:30s" viewBox="0 0 100 100"><use href="#daisy"/></svg></div></div>
  <div class="deco" style="--x:9%;--y:62%;--s:76px" data-depth="46"><div class="bob" style="--d:5.5s;--delay:-1s"><svg class="daisy" style="--sp:14s" viewBox="0 0 100 100"><use href="#daisy"/></svg></div></div>

  <div class="deco" style="--x:19%;--y:36%;--s:86px" data-depth="34"><div class="bob" style="--d:9s"><div class="cube" style="--s:86px"><i>D</i><i>Y</i><i>A</i><i>I</i><i>✿</i><i>★</i></div></div></div>
  <div class="deco" style="--x:72%;--y:28%;--s:64px" data-depth="52"><div class="bob" style="--d:7.5s;--delay:-3s"><div class="cube" style="--s:64px;--cs:11s"><i>A</i><i>I</i><i>D</i><i>Y</i><i>★</i><i>✿</i></div></div></div>

  <div class="deco" style="--x:30%;--y:10%;--s:26px" data-depth="30"><svg class="star" viewBox="0 0 20 20"><use href="#spark4"/></svg></div>
  <div class="deco" style="--x:66%;--y:14%;--s:20px" data-depth="44"><svg class="star" style="--delay:-1.2s" viewBox="0 0 20 20"><use href="#spark4"/></svg></div>
  <div class="deco" style="--x:90%;--y:38%;--s:28px" data-depth="36"><svg class="star" style="--delay:-.6s" viewBox="0 0 20 20"><use href="#spark4"/></svg></div>
  <div class="deco" style="--x:4%;--y:44%;--s:22px" data-depth="40"><svg class="star" style="--delay:-1.8s" viewBox="0 0 20 20"><use href="#spark4"/></svg></div>

  <!-- 로그인 카드 (러그 패치) -->
  <section class="card-wrap" data-tilt="9">
    <div class="card-back" aria-hidden="true"></div>
    <form class="card patch" id="login-form" novalidate>
      <div class="card-logo" data-logo="flat"></div>
      <p class="hello">오늘도 반가워요</p>

      <label class="field">
        <span>아이디</span>
        <input type="text" name="id" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="아이디" required>
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>

      <button class="go" type="submit"><span>로그인</span><i aria-hidden="true">→</i></button>
    </form>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/assets/dy.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/auth.js"></script>
<script>
  // 이미 로그인돼 있으면 바로 메인으로
  window.dyAuth.getSession().then(function (s) { if (s) location.replace("/main"); });

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    var btn = f.querySelector(".go");
    if (!f.id.value.trim() || !f.password.value) {
      window.dyToast("아이디와 비밀번호를 입력해 주세요");
      return;
    }
    btn.disabled = true;
    window.dyAuth.signIn(f.id.value, f.password.value)
      .then(function () { location.replace("/main"); })
      .catch(function (err) {
        var msg = /invalid login credentials/i.test(err && err.message)
          ? "아이디 또는 비밀번호가 맞지 않아요"
          : (err && err.message) || "로그인에 실패했어요";
        window.dyToast(msg);
        f.password.value = "";
        f.password.focus();
        btn.disabled = false;
      });
  });
</script>
</body>
</html>

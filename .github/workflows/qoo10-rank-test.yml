name: Qoo10 IP Block Test

on:
  workflow_dispatch:  # 수동 실행 가능
  schedule:
    - cron: '20 15 * * *'  # 매일 00:20 KST (UTC 15:20)

jobs:
  test-qoo10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Test Qoo10 access with requests
        id: test-requests
        run: |
          python - << 'EOF'
          import requests

          URLS = [
              "https://m.qoo10.jp/gmkt.inc/BestSellers/?g=2",
              "https://www.qoo10.jp/gmkt.inc/BestSellers/?g=2",
          ]

          HEADERS = {
              "user-agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1",
              "accept": "application/json, text/plain, */*",
              "referer": "https://m.qoo10.jp/",
          }

          for url in URLS:
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=30)
                  print(f"[requests] {url} -> HTTP {resp.status_code}, {len(resp.content)} bytes")
                  if resp.status_code == 523 or "connecting" in resp.text.lower()[:200]:
                      print(f"[requests] {url} -> BLOCKED (523 or connecting error)")
                  elif resp.status_code == 200:
                      print(f"[requests] {url} -> SUCCESS")
              except Exception as e:
                  print(f"[requests] {url} -> ERROR: {e}")
          EOF

      - name: Test Qoo10 access with Playwright
        id: test-playwright
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://m.qoo10.jp/gmkt.inc/BestSellers/?g=2",
              "https://www.qoo10.jp/gmkt.inc/BestSellers/?g=2",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1",
                  locale="ko-KR",
                  timezone_id="Asia/Seoul",
              )
              for url in URLS:
                  try:
                      page = context.new_page()
                      response = page.goto(url, wait_until="domcontentloaded", timeout=30000)
                      html = page.content()
                      print(f"[playwright] {url} -> HTTP {response.status if response else 'N/A'}, {len(html)} bytes")
                      if response and response.status == 523:
                          print(f"[playwright] {url} -> BLOCKED (523)")
                      elif response and response.status == 200:
                          print(f"[playwright] {url} -> SUCCESS")
                      page.close()
                  except Exception as e:
                      print(f"[playwright] {url} -> ERROR: {e}")
              browser.close()
          EOF
